# ============================================================
# 应用基础配置
# ============================================================
spring:
  application:
    name: ai_knowledge_web

  # ============================================================
  # .env 环境变量文件（由 springboot4-dotenv 自动加载）
  # springboot4-dotenv 是专为 Spring Boot 4 适配的 dotenv 库，
  # 会自动读取工作目录下的 .env 文件并注入 Spring Environment。
  #
  # 路径相对于**进程工作目录**（user.dir），所以必须保证工作目录是模块目录：
  #   - 命令行：cd ai_knowledge_web && mvn spring-boot:run
  #   - IDE：Run/Debug Configurations → Working directory → .../ai_knowledge_web
  #
  # 缺 .env 的处理方式通过 springdotenv.ignore-if-missing 控制（默认 false），
  # 设为 true 可让缺失 .env 时不中断启动（用于 CI 等无 .env 场景），
  # 设 false（默认）则缺失时报错，避免 ${MYSQL_HOST} 等占位符漏传到下游。
  # ============================================================
  # springdotenv:
  #   ignore-if-missing: false

  # ============================================================
  # .env 的第二条加载路径（原生 spring.config.import）
  #
  # 为什么在 dotenv 之外再挂一条：dotenv 只能读**单个工作目录**下的 .env，
  # 而工作目录取决于启动方式，两种都常见：
  #   - cwd = 模块目录 → mvn test / mvn spring-boot:run / IDE 配了模块 cwd
  #   - cwd = 仓库根   → IDE 直接 Run main（默认 $PROJECT_DIR$ = 仓库根）
  # 原生 import 支持**多候选**，这里把两种路径都列上，谁命中用谁，
  # 于是"从哪启动"不再影响能否找到 .env —— 这正是 ${MYSQL_HOST} 这类
  # 占位符没解析、最后以 MySQL 驱动 "Failed to parse the host:port pair"
  # 收场的根因。
  #
  # 都带 optional:：两个候选是互斥命中，任一缺失属正常，不加 optional
  # 会让没命中的那个直接中断启动。[.properties] 后缀是必需的 ——
  # Boot 靠扩展名判断解析器，.env 无扩展名，不写就无法推断格式。
  #
  # 若两个候选都不存在：占位符会**原样保留**而不报错
  # （Boot 的 PropertySourcesPlaceholdersResolver 对不可解析占位符不抛错），
  # 症状就是 ${MYSQL_HOST} 被当成字面量传给 JDBC 驱动。
  # 见到那个报错，第一反应应是"工作目录下没有 .env"。
  # ============================================================
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./ai_knowledge_web/.env[.properties]

  # ============================================================
  # 文件上传（S4-M05-A 新增 · T-500）
  #
  # ⚠️ **Boot 的默认上限是 1MB** —— 不改这一段，上传页选任何真实文件都会得到
  # `MaxUploadSizeExceededException`（且是容器抛的、**绕过 GlobalExceptionHandler**，
  # 前端拿到的是 HTML 错误页而不是统一响应体，现象是"上传按钮转一下就没了"）。
  # 《06》§3.1 的硬指标是「单个文件 ≤ 100 MB」，所以这里给到 100MB，
  # 请求体总量留 10MB 余量给 multipart 边界与其它表单字段。
  #
  # max-swallow-size 一起调大：Tomcat 在超过该值时**直接断开连接**而不读剩余字节，
  # 保持默认 2MB 的话，一个 100MB 的超限请求会看到"连接被重置"而不是"文件超出大小限制"。
  # ============================================================
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  # ============================================================
  # 数据源 - MySQL（业务数据库）
  # docker-compose: kb-mysql (localhost:3306)
  # ============================================================
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: kb-pool
      maximum-pool-size: 20
      minimum-idle: 5
      # 3s 就失败：让"MySQL 没起来"在启动日志里立刻可见，
      # 而不是默认 30s 卡住后再抛一句难读的 HikariPool 超时
      connection-timeout: 3000
      validation-timeout: 2000

  # ============================================================
  # 数据库迁移（T-011）
  # schema 的唯一来源是 db/migration/V*.sql，**不靠实体反推建表**。
  # 脚本里写了什么，库里就是什么；要改结构就再加一个 V 版本，
  # 变更过程留在仓库里可 review、可回放。
  # ============================================================
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 面向"库里有别人的表 / 手工建过表"的场景：非空库也能接管，
    # 把接管前的状态记为版本 0，V1 起的脚本照常执行。
    baseline-on-migrate: true
    baseline-version: 0
    # 已执行的脚本被改过就报错 —— 防止有人回头改历史脚本造成"本地能跑、别人炸"
    validate-on-migrate: true
    # 中文注释与种子数据都带非 ASCII，显式声明编码，避免按平台默认码表读入
    encoding: UTF-8

  jpa:
    hibernate:
      # 只校验、不改表：实体与 V*.sql 不一致时**启动即失败**。
      # 这正是想要的 —— 让"表结构与代码对不上"在启动时暴露，
      # 而不是等到某次查询才报 Unknown column。
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  # ============================================================
  # Spring AI：**已关闭自动装配模型**（T-014 起）
  #
  # T-009 时这里有一整段 spring.ai.openai.*（引用 app.model.* 喂给自动配置）。
  # T-014 定案「注册中心是唯一构造点」后，客户端改由 ModelClientRegistry +
  # ModelClientFactory 按 ModelConfigSpec 自己装配，自动配置产出的 Bean 无人使用，
  # 于是把那层"引用来引用去"的间接配置一并删掉 —— 模型口径只剩 app.model.* 一处。
  #
  # 开关见下面 spring.autoconfigure.exclude 里的 Chat / Embedding 两项。
  #
  # base-url 仍**不做 /v1 补全**（已读 OpenAiSetup.calculateBaseUrl 确认：非
  # OpenAI/GitHub/Azure 分支原样返回），所以**接口地址要在 .env 里写全**
  # （硅基流动含 /v1，DeepSeek 两种写法都通）。
  # ============================================================

  # ============================================================
  # Neo4j 图数据库（知识图谱存储）
  # docker-compose: kb-neo4j (localhost:7687)
  # ============================================================
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
    # 自检探测要快失败，不要拖住启动报告
    connection-timeout: 3s

  # ============================================================
  # Redis 缓存 / 会话存储
  # docker-compose: kb-valkey (localhost:6379)
  # ============================================================
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 3s
      connect-timeout: 3s

  # ============================================================
  # Spring AI 自动配置开关
  #
  # **关闭 chat + embedding**（T-014 起）：客户端统一由 ModelClientRegistry 构造
  # （决策「注册中心唯一构造点」）。若此处不关，自动配置仍会按已删除的
  # spring.ai.openai.* 造出一套 ChatModel / EmbeddingModel Bean —— 无人使用却真实存在，
  # 将来必然有人误注入它们绕过缓存与失效逻辑。
  #
  # **关闭其余模态**：图片/语音/审核本项目用不到，不建无用 Bean。
  #
  # **关闭 MilvusVectorStore**：collection、维度、索引由 MilvusCollectionInitializer
  # 以代码显式管理（维度/度量是 D-4 的不可逆决策，不适合交给自动配置的默认值）。
  # ============================================================
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.vectorstore.milvus.autoconfigure.MilvusVectorStoreAutoConfiguration

# ============================================================
# 应用自定义配置（T-008 / T-010）
# ============================================================
app:
  # ------------------------------------------------------------
  # 模型口径（T-009；T-014 在此基础上加"按库选用 + 客户端缓存"）
  #
  # 四组与 ModelType 枚举的四个值一一对应（CHAT / EMBEDDING / RERANK / VL）。
  # 这里放**唯一来源**，spring.ai.openai.* 用 ${app.model.xxx.yyy} 引用它，
  # 避免同一件事写两遍后悄悄漂移。
  #
  # 环境变量名沿用 .env 既有写法（注意 .env 里是 EMBEDDED_ 而不是 EMBEDDING_，
  # 那是项目既有命名，此处如实对齐；改名要同步改用户的 .env，不做单方面重命名）。
  # api-key 全部给空默认值：缺 key 时是"调用时明确报错"，而不是启动时报一堆
  # 莫名其妙的绑定失败 —— 本地只调存储、不调模型的场景仍然能起来。
  # ------------------------------------------------------------
  model:
    chat:
      base-url: ${CHAT_BASE_URL:}
      api-key: ${CHAT_API_KEY:}
      model: ${CHAT_MODEL:}
    embedding:
      base-url: ${EMBEDDED_API_BASE_URL:}
      api-key: ${EMBEDDED_API_KEY:}
      model: ${EMBEDDED_API_MODEL:}
    rerank:
      base-url: ${RERANKER_API_BASE_URL:}
      api-key: ${RERANKER_API_KEY:}
      model: ${RERANKER_API_MODEL:}
    vl:
      base-url: ${VL_API_BASE_URL:}
      api-key: ${VL_API_KEY:}
      model: ${VL_API_MODEL:}

    # ------------------------------------------------------------
    # 调用参数（T-014）：
    # 客户端由 ModelClientFactory 构造，超时/重试/温度也归这里 ——
    # 不再写 spring.ai.openai.*（那层已随自动配置一起删掉）。
    # ------------------------------------------------------------
    timeout-seconds: ${MODEL_TIMEOUT_SECONDS:60}
    max-retries: ${MODEL_MAX_RETRIES:2}
    # 问答场景的既有取值
    chat-temperature: ${MODEL_CHAT_TEMPERATURE:0.7}

  # CORS 允许来源（逗号分隔）。
  #
  # 注意一个反直觉点：**走 Vite proxy 并不等于绕开 CORS 校验**。
  # 浏览器对本机 dev server 发出的**所有非 GET 请求都会带 Origin 头**，
  # proxy 只是转发、不会剥掉它，于是后端照样会拿这个 Origin 去过白名单 ——
  # 不在名单里就 403 `Invalid CORS request`。
  # 因此这里默认放开本机**任意端口**：5173 被占用时 Vite 会自动落到 5174/5175…，
  # 把默认值写死成 5173 会让"端口被占"直接表现成整条链路 403
  # （看着像权限问题，实际是配置漂移 —— S1 联调时真实踩到过）。
  # 生产环境必须用 CORS_ALLOWED_ORIGINS 显式指定真实域名。
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:[*],http://127.0.0.1:[*]}

  storage:
    # true = 启动自检发现任一存储不可用就拒绝启动（CI / spike 取证用）
    # false = 只输出报告并继续启动（本地开发默认，缺容器时不耽误调其它功能）
    fail-fast: ${STORAGE_FAIL_FAST:false}

  # ------------------------------------------------------------
  # 日志旋钮（结构与格式在 logback-spring.xml，这里只留可调项）
  # ------------------------------------------------------------
  logging:
    # 日志目录。已 gitignore（根 .gitignore 的 `logs/`），不会进仓库
    dir: ${LOG_DIR:logs}
    # 保留天数与总量上限，二者谁先到谁生效（SizeAndTimeBasedRollingPolicy）
    retention-days: ${LOG_RETENTION_DAYS:30}
    max-history-gb: ${LOG_MAX_HISTORY_GB:3}
    # 项目包的日志级别。排查链路时用 APP_LOGGING_LEVEL=DEBUG，不必改代码
    level: ${APP_LOGGING_LEVEL:INFO}

  # ------------------------------------------------------------
  # 审计留存（T-306）
  #
  # retention-days 对应《11》§非功能「审计留存 180 天」。
  # retention-cron 定在 03:30 —— 避开业务高峰，且与其它清理任务错开。
  #
  # 为什么做成配置项而不是常量：运维改留存期（合规要求变化时）不该动代码重打包；
  # 更重要的是**测试可以把它关掉**（`app.audit.retention-cron: "-"` 是 Spring 的
  # 禁用写法），否则一个每天 03:30 真删数据的任务会让测试结果依赖运行时刻。
  # ------------------------------------------------------------
  audit:
    retention-days: ${AUDIT_RETENTION_DAYS:180}
    retention-cron: ${AUDIT_RETENTION_CRON:0 30 3 * * *}

  # ------------------------------------------------------------
  # Milvus：连接 + 集合 schema 的唯一口径
  # 维度锁死 1024（bge-m3，L2 归一化）—— 决策 D-4 / 风险 R-8
  # 曾误配为 1536，与 bge-m3 不符会导致写入全部失败
  # ------------------------------------------------------------
  milvus:
    host: ${MILVUS_HOST:127.0.0.1}
    port: ${MILVUS_PORT:19530}
    username: ${MILVUS_USERNAME:}
    password: ${MILVUS_PASSWORD:}
    database: ${MILVUS_DATABASE:default}
    collection: knowledge_vectors
    dimension: 1024
    metric-type: L2
    index-type: IVF_FLAT
    index-nlist: 128
    index-nprobe: 16
    initialize-schema: true
    scalar-index-enabled: true
    connect-timeout-ms: 5000
    rpc-deadline-ms: 10000

# ============================================================
# JWT（T-007）
# 密钥来自 .env 的 JWT_SECRET，**不给默认值**：缺了就启动失败，
# 好过用一个"看似能跑"的弱密钥。
# ============================================================
jwt:
  secret: ${JWT_SECRET}
  issuer: ai-knowledge
  access-ttl-minutes: 120
  refresh-ttl-days: 7
  blacklist-ttl-seconds: 7200

# ============================================================
# MinIO 对象存储（文档文件归档）
# docker-compose: kb-minio (localhost:9000)
# ============================================================
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

# ============================================================
# 服务器配置
# ============================================================
server:
  port: ${SERVER_PORT:8080}

# ============================================================
# 监控配置（Actuator + Micrometer）
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
  endpoint:
    health:
      # 展开到"每个组件一行 + 明细"，G0-5 靠这个直接看五个存储
      show-details: always
      show-components: always
  health:
    # ------------------------------------------------------------
    # 关掉 Spring Boot 自带的 db / redis / neo4j 贡献者，
    # 改用 StorageHealthConfig 提供的 mysql / redis / milvus / minio / neo4j，
    # 与 docker-compose 的容器名口径一致（避免出现两套重复指标）
    # ------------------------------------------------------------
    db:
      enabled: false
    redis:
      enabled: false
    neo4j:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true

# ============================================================
# 日志
#
# **格式与 appender 见 `src/main/resources/logback-spring.xml`** —— 本文件不再写
# logging.pattern：同一个 pattern 写两处，必然出现"改了 yml 却不生效"
# （自定义 logback-spring.xml 会让 Spring Boot 不再使用默认 appender，
# 此时 yml 里的 logging.pattern.* 就成了死配置）。
#
# 可调项（app.logging.*）在下面 app 段里，都是环境变量可覆盖的运维旋钮。
# ============================================================