# 测试期配置（**只放测试专属的覆盖项**，业务配置一律在 main 的 application.yml）
#
# 为什么必须存在这一条：
#   T-306 的审计留存清理是 `@Scheduled(cron = 0 30 3 * * *)` —— 一个**真删数据**的
#   定时任务。测试不关掉它，跑批结果就取决于"是不是恰好在 03:30 前后执行"，
#   这类偶发红是最难查的一种（改一行无关代码就变红）。
#
#   "-" 是 Spring 的禁用写法（`Scheduled.CRON_DISABLED`），不是随便一个非法 cron ——
#   写非法表达式会**启动失败**，看着像配置坏了。
#
#   2026-09-16 又加了一条，理由同源（S4-M05-C2 步 2）：
#   `T-507` 的索引增强在上传解析链路里**真调一次对话模型**。开着的话，
#   `DocParseFlowTest` 那二十来次上传每次都要等一次模型往返 ——
#   跑批结果从此取决于 relay 通不通、快不快。那正是最难查的偶发红。
#
#   关掉它**不损失覆盖**：增强的组装逻辑由 `IndexEnhancerTest` 用假 client 验
#   （断言提示词原文、解析、块构造），真实调用另有 `@Tag("network")` 的冒烟用例。
#   而"关掉之后文档仍正常入库、只是没有摘要块"这件事本身也有用例钉住。
m05.enhance.enabled=false
# T-508 向量化：同上（真调嵌入模型 + 真写 Milvus 都是外部副作用）。
# 门禁取证用显式开启的方式跑（见 plan/2026-09-17-S4-M05-C3.md §6+7）。
m05.vectorize.enabled=false

# T-512 图片描述（S6-M05-C2 步 5）：**同一条理由，但更狠**。
#
# 真 VL 实测 40~60 秒/张（#179），而 `1-DeepSeek使用.pdf` 有 26 张可描述的图 ——
# 开着它，任何含图文档的解析都要多花十几分钟，而 `DocParseFlowTest` 那批用例
# 会真的上传并解析文档。不关的话，跑批结果取决于 relay 通不通、VL 快不快。
#
# ⚠️ **关掉不等于不测**（与上面两条一字不差地同源）：
#   · 抽图与登记那半边由 `PdfImageExtractionTest` 用假 sink 验，**不需要 MinIO 也不需要 VL**；
#   · 过滤 / 拼接 / 三计数那半边由 `DocumentImageDescriberTest` 用假 VisionDescriber 验；
#   · 真 VL 那条路另有 `@Tag("network")` 的用例。
m05.image.describe.enabled=false

# 解析 worker（T-O01 · S4-E1）：测试期**关掉后台轮询**。
#
# 理由同上是"让跑批结果不取决于时序"：留着后台线程，「上传之后文档什么状态」
# 就取决于轮询间隔与执行速度的赛跑 —— 又一个最难查的偶发红。
#
# ⚠️ **关掉不等于不测**：用例改用 `ParseWorker#drainOnce()` 显式驱动
# （上传 → drainOnce() → 断言 INDEXING）。确定性更好，且覆盖一点没少 ——
# 后台那一圈 tick/claim/配额 另有专门用例（`ParseWorkerFlowTest`）。
app.parse.worker.enabled=false

# ⚠️ 只覆盖必要的项。`.properties` 与 `.yml` 同时存在时前者优先，所以本文件不会
#    影响 main 配置里其它任何值；想加别的测试覆盖项，加在这里而不是改 yml。
app.audit.retention-cron=-

# `T-C00` 图谱构建侧（S9-M12-A）：**同一条理由的第五次**。
#
# 图写入的目标是 Neo4j（另一个存储），而 `mvn test` 的硬口径是"全替身、不依赖
# 外部存储的可变性"。留着它，`DocParseFlowTest` 那批上传会真的往图库写边 ——
# 跑批结果从此取决于 Neo4j 通不通，而且**每跑一轮就往图里堆一批谁也认领不了的数据**。
#
# ⚠️ **关掉不等于不测**（与上面四条一字不差地同源）：
#   · `GraphWriter` 的公开入口只吃 `Enhancement` + 锚点表，**不自己调模型**，
#     所以 `GraphWriteFlowTest` 用 `@TestPropertySource` 单独打开它、直接构造输入，
#     走的是真实的 Cypher 与真实的 Neo4j（判据 1~9 全部在那里）。
m05.graph.enabled=false

#
# `T-C02` 图谱**检索**旁路（`S9-M12-B`）：关的理由与上面那条**同源、但后果更隐蔽** ——
# 它挂在**每一次问答**的检索链路上，开着就意味着每个用例是否绿取决于本机 Neo4j 通不通；
# 而它是**旁路**（失败只降级），所以它挂掉时用例会静默变短（少一路召回），
# 不会红给你看 —— 那种"绿得没有意义"的判据正是 `S9-M12-A` §8.1 逮到的那一类。
#
# ⚠️ **关掉不等于不测**：判据 1~9 全部在 `GraphRetrieveFlowTest` 里用
# `@TestPropertySource` 单独打开它、并直接对着**真 Neo4j + 真 MySQL** 走完旁路
# （含可见性负向锚、超时降级、三路融合与 SSE 字段）。
m05.graph.retrieve.enabled=false

# `T-616` 回收站超期清理：同上一条理由，而且它的后果**比审计留存更重** ——
# 那是**物理删除**（删 MinIO 对象 + 删 Milvus 向量 + 删行），不可逆。
# ⇒ 跑批期间它必须一次都不跑；用例改用 `RecycleService#cleanupExpired()` 显式驱动。
app.recycle.cleanup-cron=-
