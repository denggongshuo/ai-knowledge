# 测试期配置（**只放测试专属的覆盖项**，业务配置一律在 main 的 application.yml）
#
# 为什么必须存在这一条：
#   T-306 的审计留存清理是 `@Scheduled(cron = 0 30 3 * * *)` —— 一个**真删数据**的
#   定时任务。测试不关掉它，跑批结果就取决于"是不是恰好在 03:30 前后执行"，
#   这类偶发红是最难查的一种（改一行无关代码就变红）。
#
#   "-" 是 Spring 的禁用写法（`Scheduled.CRON_DISABLED`），不是随便一个非法 cron ——
#   写非法表达式会**启动失败**，看着像配置坏了。
#
#   2026-09-16 又加了一条，理由同源（S4-M05-C2 步 2）：
#   `T-507` 的索引增强在上传解析链路里**真调一次对话模型**。开着的话，
#   `DocParseFlowTest` 那二十来次上传每次都要等一次模型往返 ——
#   跑批结果从此取决于 relay 通不通、快不快。那正是最难查的偶发红。
#
#   关掉它**不损失覆盖**：增强的组装逻辑由 `IndexEnhancerTest` 用假 client 验
#   （断言提示词原文、解析、块构造），真实调用另有 `@Tag("network")` 的冒烟用例。
#   而"关掉之后文档仍正常入库、只是没有摘要块"这件事本身也有用例钉住。
m05.enhance.enabled=false
# T-508 向量化：同上（真调嵌入模型 + 真写 Milvus 都是外部副作用）。
# 门禁取证用显式开启的方式跑（见 plan/2026-09-17-S4-M05-C3.md §6+7）。
m05.vectorize.enabled=false

# 解析 worker（T-O01 · S4-E1）：测试期**关掉后台轮询**。
#
# 理由同上是"让跑批结果不取决于时序"：留着后台线程，「上传之后文档什么状态」
# 就取决于轮询间隔与执行速度的赛跑 —— 又一个最难查的偶发红。
#
# ⚠️ **关掉不等于不测**：用例改用 `ParseWorker#drainOnce()` 显式驱动
# （上传 → drainOnce() → 断言 INDEXING）。确定性更好，且覆盖一点没少 ——
# 后台那一圈 tick/claim/配额 另有专门用例（`ParseWorkerFlowTest`）。
app.parse.worker.enabled=false

# ⚠️ 只覆盖必要的项。`.properties` 与 `.yml` 同时存在时前者优先，所以本文件不会
#    影响 main 配置里其它任何值；想加别的测试覆盖项，加在这里而不是改 yml。
app.audit.retention-cron=-
