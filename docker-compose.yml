# ============================================================
# 知识库系统 - 统一数据服务 Docker Compose
#
# 服务清单（6 个）：MySQL · MinIO · Milvus(etcd + standalone) · Neo4j · Valkey
# 数据落盘：除 MySQL 走命名卷外，其余全部在 G:\db\db_data\*（bind 挂载）
#
# 本文件是本项目基础设施的**编排事实源** —— 改端口 / 改镜像 / 加服务只改这里。
# 历史上这套容器先后由 rag_service_web、trae-study 两个项目的 compose 创建，
# 收敛过程与遗留说明见 docs/后端开发文档/01-本地启动与配置.md。
#
# 启动前置与常见报错对照表也在这份文档里，遇到启动问题先看它。
# ============================================================

# 显式声明项目名：compose 默认取**目录名**当项目名，目录一改名就可能
# 冒出第二套同名容器（本项目踩过：在 ai-knowledge 目录下 up，它以为
# 要新建 kb-mysql，与既有容器撞名）。写死就不依赖目录名了。
name: ai-knowledge

services:
  # ============================================================
  # MySQL 8.4 - 业务数据存储
  # 数据卷: 命名卷 kb-mysql-data（内含真实库 knowledge_base）
  # 端口: 3306
  #
  # 注意：**故意不用 bind 挂载**。真实业务数据是当初从旧匿名卷复制进
  # 命名卷的，改成 G:/db/db_data/mysql 会挂到一个空目录上，库直接"消失"。
  # ============================================================
  mysql:
    container_name: kb-mysql
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: knowledge_base
      MYSQL_USER: kb_user
      MYSQL_PASSWORD: kb_password
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - kb-mysql-data:/var/lib/mysql
      # 配置文件（可选）
      # - ./mysql/conf.d:/etc/mysql/conf.d
      # 初始化SQL（可选，首次启动时执行）
      # - ./mysql/init:/docker-entrypoint-initdb.d
    command:
      - --character-set-server=utf8mb4
      # 🔴 `T-O13`（2026-09-20）：原来是 `utf8mb4_unicode_ci` —— 那是**分歧的根因**：
      #    没写 `COLLATE` 的迁移（V17/V22/V23/V25/V27/V31）继承了这个默认，
      #    而写了的那批是 `utf8mb4_0900_ai_ci` ⇒ 库里两套排序规则并存 ⇒
      #    跨表比较字符串列报 `1267 Illegal mix of collations`（只在跑到那条 SQL 时才炸）。
      # 收敛方向 = `0900_ai_ci`（MySQL 8 原生、也是多数派），并已在 `V33` 里
      # `ALTER DATABASE` + 把 9 张业务表 `CONVERT` 过去。
      # ⚠️ **改这一行要重建容器才生效** —— 所以它不是兜底（兜底是 `V33` 的 ALTER DATABASE），
      #    它只是让"重装一套新环境"从第一天就只有一套排序规则。
      # 闸：`CollationUniformityTest`（全库一致 + 库默认 + 冻结豁免）。
      - --collation-server=utf8mb4_0900_ai_ci
      - --mysql-native-password=ON
      - --max_connections=200
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network

  # ============================================================
  # MinIO - 对象存储（文档文件归档）
  # 数据存储: G:\db\db_data\minio
  # API端口: 9000 | 控制台端口: 9001
  #
  # 变量名说明：官方自 2021 起改用 MINIO_ROOT_USER / MINIO_ROOT_PASSWORD，
  # MINIO_ACCESS_KEY / MINIO_SECRET_KEY 是仍在生效的旧名。此处**保留旧名**
  # 是有意的 —— 改环境变量会改变该服务的配置指纹，compose 随即重建容器；
  # 而这两个变量名在用的是同一对值（minioadmin/minioadmin），改动没有收益。
  # 换新名时请连带确认 MINIO_ACCESS_KEY / MINIO_SECRET_KEY 两个 .env 值同步。
  # bucket 不用手工建：应用侧 MinioBucketInitializer 启动时按 minio.bucket 建。
  # ============================================================
  minio:
    container_name: kb-minio
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - G:/db/db_data/minio/data:/data
      - G:/db/db_data/minio/config:/root/.minio
    command: minio server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kb-network

  # ============================================================
  # etcd - Milvus 的元数据存储
  # 数据存储: G:\db\db_data\milvus\etcd
  # ============================================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - G:/db/db_data/milvus/etcd:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - kb-network

  # ============================================================
  # Milvus Standalone - 向量数据库
  # 数据存储: G:\db\db_data\milvus\milvus
  # API端口: 19530 | 健康检查端口: 9091
  #
  # collection 不在这里建：schema（1024 维 / L2 / IVF_FLAT）由应用侧
  # MilvusCollectionInitializer 以代码显式管理（决策 D-4，建错要重建全量向量）。
  # ============================================================
  standalone:
    container_name: milvus-standalone
    image: milvusdb/milvus:v2.6.17
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MQ_TYPE: woodpecker
    volumes:
      - G:/db/db_data/milvus/milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - "etcd"
      - "minio"
    networks:
      - kb-network

  # ============================================================
  # Neo4j 5.26 - 图数据库（知识图谱旁路）
  # 数据存储: G:\db\db_data\neo4j
  # 浏览器端口: 7474 | 驱动连接端口: 7687
  # 密码: 与 .env 的 NEO4J_PASSWORD 必须一致，改一处要改两处
  # ============================================================
  neo4j:
    container_name: kb-neo4j
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/your_password_here
      TZ: Asia/Shanghai
    ports:
      - "7474:7474"  # Neo4j Browser 网页管理界面
      - "7687:7687"  # 应用程序连接的 Bolt 协议端口
    volumes:
      - G:/db/db_data/neo4j:/data
      # 可选：日志与插件目录（自动创建）
      # - G:/db/db_data/neo4j/logs:/logs
      # - G:/db/db_data/neo4j/plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 5
    networks:
      - kb-network

  # ============================================================
  # Valkey 8.1 - Redis 协议兼容的缓存 / 会话存储（T-008 五存储之一）
  # 数据存储: G:\db\db_data\valkey（含 dump.rdb，RDB 持久化）
  # 端口: 6379
  #
  # ⚠️ 本实例**不只服务本项目**：Python 侧 rag_service 在同一实例上用了
  #     rag:ingest:stream        —— 文档摄取队列（config/settings.py）
  #     embed:query:{model}:{sha} —— 查询嵌入缓存（core/retrieval/embed_query_node.py）
  #   本项目的键有自己的前缀（ak:audit:seq:*），不冲突；但**重启本容器会
  #   中断对方**，动它之前先确认对方不在跑。
  # ============================================================
  valkey:
    container_name: kb-valkey
    image: valkey/valkey:8.1.8
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - G:/db/db_data/valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kb-network

  # ============================================================
  # ClamAV（`T-O04` 步 3）—— 恶意内容扫描
  #
  # 🔴 **默认不启动**，必须显式带 profile 才起：
  #     docker compose --profile av up -d clamav
  #
  # 为什么默认不启动（`O4` §6 自己写的风险）：
  #   · 常驻内存约 **1 GB**，而本机的 docker 已经跑着 6 个服务；
  #   · 它的病毒库要下载 + 常驻更新，首次启动要几分钟 ——
  #     不能因为本地开发没装杀毒引擎就把**上传**堵死。
  # 所以后端侧的口径是「未部署 → 降级为跳过 + 标记」（`ClamAvScanner` 的类注释），
  # 列表上显示「未扫描」而**不是**假装扫过了（判据 6）。
  #
  # ⚠️ 与 `kb-` 前缀的其他服务不同，容器名保持上游的 `clamav`：
  #     这个名字由镜像自身的文档与社区命令普遍引用（`docker exec clamav clamdscan`），
  #     改成 `kb-clamav` 会让每次照文档敲命令的人多踩一次坑。
  # ============================================================
  clamav:
    container_name: clamav
    image: clamav/clamav:stable
    restart: unless-stopped
    profiles: ["av"]
    ports:
      - "3310:3310"
    # `clamd` 第一次启动要先下载病毒库（几百 MB），healthcheck 给足启动时间
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s
    networks:
      - kb-network

# ============================================================
# 网络
# ============================================================
networks:
  kb-network:
    name: kb-network
    driver: bridge

volumes:
  # MySQL 真实数据卷（含 knowledge_base，从旧匿名卷复制而来）——
  # 显式固定 name，避免 compose 加项目名前缀后找不到旧数据。
  kb-mysql-data:
    name: kb-mysql-data
