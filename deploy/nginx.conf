# ai-knowledge 前端静态托管 + /api 反向代理（T-D03）
#
# 部署形态（2026-09-28 用户裁定 A' 方案）：
#   · Nginx 跑在容器里，对外 8081 → 容器 80
#   · 静态资源来自宿主机 `npm run build` 产出的 ai_knowledge_app/dist（只读挂载）
#   · /api 反代到宿主机 8080 上 `mvn spring-boot:run` 起的 Spring Boot
#   · 浏览器视角只有一个 origin（localhost:8081）⇒ 同源，无跨域
#
# ⚠️ 唯一的门禁要害：/api/chat/completions 是 SSE，必须关掉代理缓冲，
#    否则 Nginx 会把整条流攒到最后一次性吐给浏览器 —— 流式退化成"转圈很久然后全文出现"。
#    这正是 G9-6 要验的东西。改回 proxy_buffering on 必须能让 G9-6 转红。

server {
    listen       80;
    server_name  _;

    # 静态资源根；与 docker-compose 里挂载的 dist 对应
    root  /usr/share/nginx/html;
    index index.html;

    # 客户端上传上限：与后端 spring.servlet.multipart.max-request-size 对齐（100MB）
    client_max_body_size 100m;

    charset utf-8;

    # ---------- 静态资源（Vue Router history 模式回退）----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 不缓存，避免发版后浏览器拿旧入口
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- SSE：必须放在 /api 之前（更长的前缀优先匹配）----------
    # 🔴 门禁 G9-6 的全部要害在这几行。
    #   proxy_buffering off      —— 不攒响应，收到字节就转发
    #   proxy_cache off          —— 不建缓存
    #   X-Accel-Buffering no     —— 双保险：即使上层误开了 buffering，也让后端声明不要缓冲
    #   proxy_read_timeout       —— LLM 首 token 可能较慢，避免被默认 60s 掐断
    #   gzip off                 —— gzip 会引入自己的缓冲层，对流式是负作用
    location ^~ /api/chat/completions {
        proxy_pass http://host.docker.internal:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_buffering  off;
        proxy_cache      off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        gzip off;

        add_header X-Accel-Buffering no always;
    }

    # ---------- 其余 API 反代 ----------
    location /api/ {
        proxy_pass http://host.docker.internal:8080;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # 上传大文件（≤100MB）解析可能较慢
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Actuator / 健康检查也走反代，便于联调
    location /actuator/ {
        proxy_pass http://host.docker.internal:8080;
        proxy_set_header Host $host;
    }
}
