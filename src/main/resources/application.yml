spring:
  application:
    name: ai-knowledge

  ai:
    # 单一 Embedding 模型（RAG 入库使用，走 OpenRouter 的 OpenAI 兼容端点）
    openai:
      base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
      api-key: ${OPENROUTER_API_KEY:}
      embedding:
        options:
          model: ${OPENROUTER_EMBED_MODEL:text-embedding-3-small}

    # 本地 Milvus 向量库
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
          username: root
          password: milvus
        databaseName: default
        collectionName: knowledge_base
        embeddingDimension: 1536
        indexType: IVF_FLAT
        metricType: COSINE

# ============================================================
# 开发 / 测试环境（默认，非 prod）：只用单一 chat 模型
# 由上面的 spring.ai.openai 驱动 starter 自动配置一个 ChatModel，
# SingleModelConfig 直接复用它，无需 ai.models.chat 配置。
# ============================================================

---
# 生产环境：启用多模型工厂 + 路由 + 本地兜底
spring:
  config:
    activate:
      on-profile: prod
  # 生产环境由 MultiModelConfig 管理 chat 模型，禁用 OpenAI chat 自动配置，避免与工厂冲突
  # （embedding 自动配置保留，供 Milvus 向量库入库使用）
  autoconfigure:
    exclude: org.springframework.ai.autoconfigure.openai.OpenAiChatAutoConfiguration
  ai:
    models:
      chat:
        deepseek-v4-pro:
          id: deepseek-v4-pro
          displayName: "DeepSeek V4 Pro（推理）"
          base-url: ${DEEPSEEK_BASE_URL:https://openrouter.ai/api/v1}
          api-key: ${DEEPSEEK_API_KEY:}
          model: ${DEEPSEEK_PRO_MODEL:deepseek/deepseek-v4-pro}
          capabilities: [REASONING, CHAT]
          preferredTasks: [REASONING]
          tier: PREMIUM
          local: false
          timeout: 120s
        deepseek-v4-flash:
          id: deepseek-v4-flash
          displayName: "DeepSeek V4 Flash（闲聊）"
          base-url: ${DEEPSEEK_BASE_URL:https://openrouter.ai/api/v1}
          api-key: ${DEEPSEEK_API_KEY:}
          model: ${DEEPSEEK_FLASH_MODEL:deepseek/deepseek-v4-flash}
          capabilities: [CHAT, REASONING]
          preferredTasks: [CHAT]
          tier: STANDARD
          local: false
          timeout: 60s
        ollama-local:
          id: ollama-local
          displayName: "本地 Ollama（兜底）"
          base-url: ${OLLAMA_BASE_URL:http://localhost:11434/v1}
          api-key: ${OLLAMA_API_KEY:}
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
          capabilities: [CHAT]
          preferredTasks: []
          tier: LOCAL
          local: true
          timeout: 120s
